name: Buildozer Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer -v android debug
        workdir: .

    - name: Upload APK
      uses: actions/upload-artifact@v4  # 修改点：升级到 v4
      with:
        name: my-app-apk
        path: ${{ steps.buildozer.outputs.filename }}
